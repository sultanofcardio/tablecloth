# Publishes a release when a version tag is pushed:
#
#   1. edit CHANGELOG.md: rename "Unreleased" to the new version and date
#   2. npm version <patch|minor|major>   (commits and tags vX.Y.Z)
#   3. git push --follow-tags
#
# An existing tag can also be released by hand from the Actions tab or with
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
#
# Needs a repository secret VSCE_PAT: an Azure DevOps personal access token
# with the "Marketplace (Manage)" scope for the sultanofcardio publisher.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version ($expected)" >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: VS Code extension-host smoke test
        run: xvfb-run -a npm run test:vscode

      - name: Package
        run: npx vsce package --no-dependencies --out tablecloth-${TAG#v}.vsix

      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-notes.mjs "${TAG#v}" > release-notes.md

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath tablecloth-${TAG#v}.vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Tablecloth ${TAG#v}" \
            --notes-file release-notes.md \
            tablecloth-${TAG#v}.vsix
