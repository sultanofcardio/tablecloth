name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: VS Code extension-host smoke test
        run: xvfb-run -a npm run test:vscode
      - name: Package (checks the manifest and .vscodeignore)
        run: npx vsce package --no-dependencies
