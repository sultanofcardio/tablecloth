<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Tablecloth marketplace icon · "The Bistro Table" -->
  <defs>
    <pattern id="gg" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fdf6f0"/>
      <rect x="8" width="8" height="16" fill="#e25555" opacity=".5"/>
      <rect y="8" width="16" height="8" fill="#e25555" opacity=".5"/>
    </pattern>
    <linearGradient id="leggrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d5178"/>
      <stop offset=".45" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#233049"/>
    </linearGradient>
  </defs>
  <!-- pedestal: database leg flaring continuously into the base -->
  <path d="M46 58 V92 C46 101 38 103 38 110 q0 3 3 3 h46 q3 0 3 -3 C90 103 82 101 82 92 V58 Z" fill="url(#leggrad)"/>
  <path d="M46 75 c0 5.5 8 9.5 18 9.5 s18 -4 18 -9.5 M46 89 c0 5.5 8 9.5 18 9.5 s18 -4 18 -9.5"
        fill="none" stroke="#5d77a8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M50.5 63 v30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".14"/>
  <!-- cloth: top + skirt all the way around -->
  <path d="M18 44 V66 q11.5 10 23 0 t23 0 t23 0 t23 0 V44 Z" fill="url(#gg)" stroke="#b23c3c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 48 v20 M64 50 v22 M88 48 v20" stroke="#b23c3c" stroke-width="2" opacity=".35"/>
  <ellipse cx="64" cy="44" rx="46" ry="14" fill="url(#gg)" stroke="#b23c3c" stroke-width="3"/>
</svg>
